
openapi: 3.1.0

info:
  title: Invoice Processing API
  version: 1.0.0
  description: |
    API for storing, retrieving, and reporting extracted invoice data.
    Designed to receive invoice data from n8n workflows for both
    real-time email processing and scheduled bulk processing.

servers:
  - url: http://localhost:8081/api/v1
    description: Local development server

tags:
  - name: Invoices
  - name: Reports
  - name: Image Processing

paths:

  /invoice.create:
    post:
      tags:
        - Invoices
      summary: Create a single invoice
      description: |
        Stores an email, extraction run, invoice, and its line items.

        Intended for real-time n8n workflows triggered by a new email.
        Repeated requests for the same Gmail ID and invoice number return
        the existing invoice. Include an invoice number when one email can
        contain multiple invoices.
      operationId: createInvoice
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreateRequest'
      responses:
        '201':
          description: Invoice successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceCreateResponse'
        '200':
          description: Invoice already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /invoice.bulk-create:
    post:
      tags:
        - Invoices
      summary: Create multiple invoices
      description: |
        Stores multiple invoice records in one request, including multiple
        invoices associated with the same email.

        Intended for scheduled or batch n8n workflows that process
        multiple invoices from one or more emails. Set extraction.channel
        to pdf or img for each item.

        Each invoice is processed independently. Partial success is
        supported: a failed record does not prevent other records
        from being processed.

        The request may contain invoices directly or inside a body wrapper
        for n8n compatibility. Maximum 100 invoices per request. Larger
        batches should be split into multiple requests.
      operationId: bulkCreateInvoices
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - invoices
                  properties:
                    invoices:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/InvoiceCreateRequest'
                - type: object
                  required:
                    - body
                  properties:
                    body:
                      type: object
                      required:
                        - invoices
                      properties:
                        invoices:
                          type: array
                          minItems: 1
                          maxItems: 100
                          items:
                            $ref: '#/components/schemas/InvoiceCreateRequest'
      responses:
        '200':
          description: Batch processing completed, possibly with partial failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkInvoiceCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /invoice.list:
    get:
      tags:
        - Invoices
      summary: List invoices
      description: Retrieve invoices using filters and pagination.
      operationId: listInvoices
      parameters:
        - name: vendor_name
          in: query
          schema:
            type: string

        - name: po_number
          in: query
          schema:
            type: string

        - name: invoice_number
          in: query
          schema:
            type: string

        - name: is_invoice
          in: query
          schema:
            type: boolean

        - name: processing_status
          in: query
          description: Filter by invoice PO-verification workflow status.
          schema:
            type: string
            enum:
              - awaiting_po
              - processing
              - verified
              - mismatch
              - needs_review
              - error
              - not_applicable

        - name: from_date
          in: query
          description: Filter by invoice date, starting from this date.
          schema:
            type: string
            format: date

        - name: to_date
          in: query
          description: Filter by invoice date, ending on this date.
          schema:
            type: string
            format: date

        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Invoice list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /invoice.get:
    get:
      tags:
        - Invoices
      summary: Get invoice details
      operationId: getInvoice
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Invoice details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /convert:
    post:
      tags:
        - Image Processing
      summary: Convert a PDF into page images
      description: |
        Converts an uploaded PDF to PNG images at 150 DPI and returns each
        image as a Base64-encoded string. This endpoint runs in the invoice
        API server at `/api/v1/convert`. Only filenames ending in `.pdf` are
        accepted. Uploads are limited to 20 MB and conversion includes at
        most the first 10 pages.
      operationId: convertPdfToImages
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file to convert; the filename must end in `.pdf`.
      responses:
        '200':
          description: PDF pages converted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfImageConversionResponse'
        '400':
          description: Missing or invalid PDF upload, or PDF conversion failed
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Method other than POST used for this endpoint
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Conversion tools unavailable or temporary/image I/O failure
          content:
            text/plain:
              schema:
                type: string

  /report.gen:
    post:
      tags:
        - Reports
      summary: Reconcile purchase orders against stored invoices
      description: |
        Accepts normalized CSV/XLSX sheet data. Each unique PO number is
        matched to stored invoice records by PO number, vendor, and currency.
        The PO amount must exactly equal the sum of matching invoice totals.
        Matching invoice rows are updated to verified or mismatch. Rows that
        cannot be matched unambiguously are marked needs_review in the
        returned workbook. Stored invoices with the same PO number are also
        updated to needs_review; a PO number with no stored invoice has no
        database row to update.

        Duplicate PO numbers in the uploaded workbook are marked needs_review.
        The returned workbook includes or updates an automation_status column.
      operationId: generateReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: Reconciliation completed and an annotated Excel workbook returned
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: Parsed workbook exceeds the request size limit
        '415':
          description: Request content type must be application/json
        '500':
          $ref: '#/components/responses/InternalError'

components:

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional key used to identify a repeated API request.
        Reusing a key with the same request should not create
        duplicate records.
      schema:
        type: string
        maxLength: 255

  schemas:

    ReportRequest:
      type: object
      required:
        - file_name
        - sheets
      properties:
        file_name:
          type: string
          maxLength: 255
        sheets:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ReportSheet'

    ReportSheet:
      type: object
      required:
        - name
        - header_row
        - columns
        - rows
      properties:
        name:
          type: string
        header_row:
          type: integer
          minimum: 1
        columns:
          type: array
          maxItems: 200
          items:
            type: object
            required:
              - key
              - label
            properties:
              key:
                type: string
              label:
                type: string
        rows:
          type: array
          maxItems: 10000
          items:
            type: object
            required:
              - source_row
              - values
            properties:
              source_row:
                type: integer
                minimum: 1
              values:
                type: object
                additionalProperties:
                  type: string

    InvoiceCreateRequest:
      type: object
      required:
        - email
        - extraction
        - invoice
        - line_items
      properties:

        email:
          $ref: '#/components/schemas/EmailInput'

        extraction:
          $ref: '#/components/schemas/ExtractionInput'

        invoice:
          $ref: '#/components/schemas/InvoiceInput'

        line_items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItem'

    EmailInput:
      type: object
      required:
        - gmail_id
      properties:
        gmail_id:
          type: string
          description: Unique Gmail message ID.
        thread_id:
          type: string
        gmail_url:
          type: string
          format: uri
          readOnly: true
          description: Gmail web URL for opening the source thread, when available.
        subject:
          type: string
        sender:
          type: string
        recipient:
          type: string
        email_date:
          type: string
          format: date-time
        body:
          type: string

    ExtractionInput:
      type: object
      required:
        - channel
        - model
      properties:
        channel:
          type: string
          enum:
            - pdf
            - img
        model:
          type: string
          description: Extraction model name.
        created_at:
          description: Timestamp or model-provided creation metadata.
          oneOf:
            - type: string
              format: date-time
            - type: array
              items: {}
        done:
          type: boolean
        done_reason:
          type: string
        response_count:
          type: integer
          minimum: 0

    InvoiceInput:
      type: object
      properties:
        is_invoice:
          type: boolean
        reason:
          type: string
          description: Reason when the document is not an invoice.
        vendor_name:
          type: string
        invoice_number:
          type: string
          description: Invoice number used with gmail_id to deduplicate invoices from the same email.
        invoice_date:
          type: string
          format: date
        po_number:
          type: string
        due_date:
          type: string
          format: date
        bill_to:
          type: string
        currency:
          type: string
          maxLength: 10
          example: INR
        subtotal:
          type: number
          format: double
        tax_amount:
          type: number
          format: double
        grand_total:
          type: number
          format: double
        notes:
          type: string

    InvoiceLineItem:
      type: object
      properties:
        description:
          type: string
        quantity:
          type: number
          format: double
        unit:
          type: string
        unit_price:
          type: number
          format: double
        line_total:
          type: number
          format: double

    InvoiceCreateResponse:
      type: object
      required:
        - success
        - invoice_id
      properties:
        success:
          type: boolean
        invoice_id:
          type: integer
          format: int64
        message:
          type: string
        already_exists:
          type: boolean
          default: false

    BulkInvoiceCreateResponse:
      type: object
      required:
        - total
        - created
        - already_exists
        - failed
        - results
      properties:
        total:
          type: integer
        created:
          type: integer
        already_exists:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            type: object
            required:
              - gmail_id
              - status
            properties:
              gmail_id:
                type: string
              status:
                type: string
                enum:
                  - created
                  - already_exists
                  - failed
              invoice_id:
                type: integer
                format: int64
              err_code:
                type: string
              err_msg:
                type: string

    InvoiceListResponse:
      type: object
      required:
        - total
        - page
        - limit
        - invoices
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceSummary'

    InvoiceSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        vendor_name:
          type: string
        invoice_number:
          type: string
        invoice_date:
          type: string
          format: date
        po_number:
          type: string
        grand_total:
          type: number
        currency:
          type: string
        is_invoice:
          type: boolean
        processing_status:
          type: string
          description: Invoice PO-verification workflow status.
          enum:
            - awaiting_po
            - processing
            - verified
            - mismatch
            - needs_review
            - error
            - not_applicable
        created_at:
          type: string
          format: date-time

    InvoiceDetailResponse:
      type: object
      properties:
        invoice:
          $ref: '#/components/schemas/InvoiceSummary'
        extraction:
          $ref: '#/components/schemas/ExtractionInput'
        email:
          $ref: '#/components/schemas/EmailInput'
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItem'

    PdfImageConversionResponse:
      type: object
      required:
        - filename
        - page_count
        - images
      properties:
        filename:
          type: string
          description: Name of the uploaded PDF.
        page_count:
          type: integer
          minimum: 1
          maximum: 10
          description: Number of pages converted, up to the first 10 PDF pages.
        images:
          type: array
          description: Base64-encoded PNG image for each converted page.
          items:
            type: string
            format: byte

    Error:
      type: object
      required:
        - err_code
        - err_msg
      properties:
        err_code:
          type: string
        err_msg:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:

    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Request conflicts with existing data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
